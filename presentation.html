<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>GIG — Presentation</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Kufam:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a14;font-family:'Almarai',sans-serif;}

/* ── 1920×1080 stage, scaled to fit ── */
#stage{
  width:1920px;height:1080px;position:fixed;top:0;left:0;
  transform-origin:top left;overflow:hidden;
}
#bg{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}

/* ── 3D tablet ── */
#tablet-wrap{
  position:absolute;left:150px;top:95px;
  width:1045px;height:825px;
  perspective:1800px;perspective-origin:50% 50%;
}
#tablet{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  border-radius:34px;
  background:linear-gradient(155deg,#15151c 0%,#26262f 48%,#15151c 100%);
  box-shadow:
    0 60px 120px -30px rgba(10,8,40,.55),
    0 30px 60px -20px rgba(10,8,40,.4),
    inset 0 0 0 2px rgba(255,255,255,.05);
  padding:26px;
}
/* subtle camera bump / front speaker */
#tablet::before{
  content:'';position:absolute;top:50%;right:11px;transform:translateY(-50%);
  width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle,#3a3a45,#15151c);
}
#screen{
  width:100%;height:100%;border-radius:14px;overflow:hidden;
  background:#fff;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
}
#screen iframe{
  width:100%;height:100%;border:0;display:block;background:#fff;
}
/* soft screen glare */
#glare{
  position:absolute;inset:0;pointer-events:none;border-radius:14px;
  background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 28%);
  opacity:.6;
}

/* ── right-side headlines ── */
#head{
  position:absolute;right:75px;top:0;height:1080px;width:560px;
  display:flex;flex-direction:column;justify-content:center;
  align-items:flex-end;padding-bottom:420px;
}
#eyebrow{
  font-family:'Almarai',sans-serif;font-weight:700;font-size:21px;
  color:#d28c64;letter-spacing:.5px;margin-bottom:12px;opacity:0;
  width:100%;direction:rtl;text-align:right;unicode-bidi:isolate;
}
#title{
  font-family:'Kufam',sans-serif;font-weight:900;font-size:52px;
  line-height:1.2;color:#19058c;opacity:0;
  width:100%;direction:rtl;text-align:right;unicode-bidi:isolate;
}

/* ── address-bar intro ── */
#addrbar{
  position:absolute;left:0;top:0;width:1920px;height:1080px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;z-index:20;pointer-events:none;opacity:0;
}
#addrbar-pill{
  display:flex;align-items:center;gap:14px;
  background:#fff;border-radius:50px;
  padding:20px 40px;width:720px;
  box-shadow:0 32px 80px rgba(10,8,40,.22),0 6px 24px rgba(10,8,40,.1);
  border:1.5px solid rgba(25,5,140,.1);
}
#ab-lock{flex-shrink:0;display:flex;align-items:center;}
#ab-url{
  flex:1;text-align:center;
  font-family:'Almarai',sans-serif;font-weight:400;font-size:26px;
  color:#19058c;letter-spacing:.4px;direction:ltr;
}
#ab-cursor{
  width:2px;height:28px;background:#19058c;
  border-radius:1px;flex-shrink:0;display:inline-block;
}
#ab-loadbar{
  width:720px;height:4px;background:rgba(25,5,140,.1);
  border-radius:3px;overflow:hidden;
}
#ab-loadfill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#19058c 0%,#d28c64 100%);
  border-radius:3px;
}

/* ── controls ── */
.pbtn{
  position:fixed;z-index:99999;border:none;border-radius:10px;cursor:pointer;
  font:700 15px Almarai,sans-serif;color:#fff;padding:12px 20px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#playBtn{top:14px;left:14px;background:#19058c;}
#recBtn {top:14px;left:150px;background:#c0392b;}
.pbtn.hide{display:none;}
</style>
</head>
<body>

<div id="stage">
  <img id="bg" src="images/bg-presentation.png" alt="">

  <!-- address-bar intro overlay -->
  <div id="addrbar">
    <div id="addrbar-pill">
      <span id="ab-lock">
        <svg width="18" height="20" viewBox="0 0 18 20" fill="none">
          <rect x="1.5" y="8.5" width="15" height="11" rx="2.5" stroke="#19058c" stroke-width="1.6" fill="none"/>
          <path d="M4.5 8.5V6A4.5 4.5 0 0 1 13.5 6v2.5" stroke="#19058c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <circle cx="9" cy="14" r="1.8" fill="#19058c"/>
        </svg>
      </span>
      <span id="ab-url"></span>
      <span id="ab-cursor"></span>
    </div>
    <div id="ab-loadbar"><div id="ab-loadfill"></div></div>
  </div>

  <div id="tablet-wrap">
    <div id="tablet">
      <div id="screen">
        <iframe id="frame" src="index-tablet.html?embed" title="GIG"></iframe>
        <div id="glare"></div>
      </div>
    </div>
  </div>

  <div id="head">
    <div id="eyebrow"></div>
    <div id="title"></div>
  </div>
</div>

<button id="playBtn" class="pbtn">▶ تشغيل العرض</button>
<button id="recBtn"  class="pbtn">● تسجيل وحفظ</button>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage'), frame = $('frame');

/* ── headline copy per scene (easy to edit) ── */
const HEAD = {
  s1:       { eye:'آلية تقديم المطالبات', t:'التحقق من هوية الأفراد' },
  otp:      { eye:'آلية تقديم المطالبات', t:'رمز التحقق الأمني' },
  s3:       { eye:'آلية تقديم المطالبات', t:'التحقق — الشركات والبنوك' },
  najm:     { eye:'تفاصيل الحادث',        t:'المطالبة عبر تقرير نجم' },
  basher:   { eye:'تفاصيل الحادث',        t:'المطالبة عبر باشر / المرور' },
  other:    { eye:'تفاصيل الحادث',        t:'المطالبة لعملاء جي آي جي' },
  estimate: { eye:'تقدير الأضرار',        t:'التقدير والبيانات البنكية' },
  review:   { eye:'الخطوة الأخيرة',       t:'مراجعة وتقديم المطالبة' },
  end:      { eye:'',                      t:'' }
};

/* ── scale stage to viewport (contain) ── */
function scaleStage(){
  const sc = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  const tx = (window.innerWidth-1920*sc)/2, ty=(window.innerHeight-1080*sc)/2;
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
}
scaleStage(); window.addEventListener('resize',scaleStage);

/* ── tablet resting pose + hidden start ── */
function setTabletStart(){
  gsap.set('#tablet',{y:920, rotationY:0, rotationX:0, x:0, z:0, scale:1, opacity:0, transformOrigin:'50% 50%'});
  gsap.set(['#eyebrow','#title'],{opacity:0});
}
setTabletStart();

function tabletEnter(){
  return new Promise(res=>{
    const tl = gsap.timeline({onComplete:res});
    tl.to('#tablet',{y:0, opacity:1, duration:1.6, ease:'power3.out'})
      .to('#tablet',{y:-6, duration:0.6, ease:'sine.inOut'},'-=0.1')
      .to('#tablet',{y:0,  duration:0.5, ease:'sine.inOut'});
  });
}

/* ── headline switching ── */
let curKey=null;
function showHead(key){
  if(key===curKey) return; curKey=key;
  const h = HEAD[key]; if(!h) return;
  const tl = gsap.timeline();
  tl.to(['#eyebrow','#title'],{opacity:0, y:-14, duration:.3, ease:'power2.in'})
    .add(()=>{ $('eyebrow').textContent=h.eye; $('title').textContent=h.t; })
    .fromTo('#eyebrow',{opacity:0,y:18},{opacity:1,y:0,duration:.45,ease:'power3.out'})
    .fromTo('#title',  {opacity:0,y:22},{opacity: (h.t?1:0), y:0,duration:.55,ease:'power3.out'},'-=0.3');
}

window.addEventListener('message', e=>{
  if(e.data && e.data.gigScene) showHead(e.data.gigScene);
});

/* ── address bar intro ── */
function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function addressBarIntro(){
  const urlEl=$('ab-url'), curEl=$('ab-cursor'), fillEl=$('ab-loadfill');

  gsap.set('#addrbar',{opacity:0,scale:1});
  gsap.set('#addrbar-pill',{y:40,scale:.88,opacity:0});
  gsap.set('#ab-loadbar',{opacity:0,y:8});

  /* pill drops in */
  await new Promise(res=>{
    const tl=gsap.timeline({onComplete:res});
    tl.to('#addrbar',{opacity:1,duration:.01})
      .to('#addrbar-pill',{y:0,scale:1,opacity:1,duration:.75,ease:'back.out(2)'})
      .to('#ab-loadbar',{opacity:1,y:0,duration:.3,ease:'power2.out'},'-=.2');
  });

  /* cursor blink */
  const blinkTween = gsap.to(curEl,{opacity:0,duration:.45,repeat:-1,yoyo:true,ease:'power1.inOut'});

  /* typewriter */
  const url='www.gig.sa';
  for(let i=0;i<=url.length;i++){
    urlEl.textContent=url.slice(0,i);
    await delay(i===0?200:75);
  }

  await delay(350);
  blinkTween.kill(); gsap.set(curEl,{opacity:0});

  /* loading bar fills */
  await new Promise(res=>gsap.to(fillEl,{width:'100%',duration:1.2,ease:'power2.inOut',onComplete:res}));

  await delay(300);

  /* exit — expand & fade, like entering the site */
  await new Promise(res=>{
    gsap.to('#addrbar',{opacity:0,scale:1.12,duration:.65,ease:'power2.in',onComplete:res});
  });
  gsap.set('#addrbar',{display:'none'});
}

/* ── start the show (with optional recording) ── */
let mediaRec=null, recChunks=[], recTap=null;

async function start(record, btn){
  $('playBtn').classList.add('hide'); $('recBtn').classList.add('hide');

  const fw = frame.contentWindow;

  /* resume the iframe's audio engine on this user gesture */
  try{ const c = fw.getACtx(); if(c.state==='suspended') await c.resume(); }catch(e){}

  if(record){
    try{
      const display = await navigator.mediaDevices.getDisplayMedia({
        video:{ frameRate:60, width:1920, height:1080 }, audio:false });
      const ctx = fw.getACtx(); fw.getMaster();
      if(!recTap){ recTap = ctx.createMediaStreamDestination(); fw._softBus.connect(recTap); }
      const stream = new MediaStream([...display.getVideoTracks(), ...recTap.stream.getAudioTracks()]);
      const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
        ? 'video/webm;codecs=vp9,opus' : 'video/webm';
      mediaRec = new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:16000000});
      recChunks=[];
      mediaRec.ondataavailable=ev=>{ if(ev.data.size) recChunks.push(ev.data); };
      mediaRec.onstop=()=>{
        const blob=new Blob(recChunks,{type:'video/webm'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob); a.download='gig-presentation.webm'; a.click();
        display.getTracks().forEach(t=>t.stop());
      };
      mediaRec.start();
    }catch(err){ alert('تعذّر بدء التسجيل: '+err.message); }
  }

  /* 1) address bar types URL, 2) tablet rises, 3) headlines, 4) run */
  await addressBarIntro();
  showHead('s1');
  await tabletEnter();
  await delay(300);
  try{ fw.run(); }catch(e){}
}

/* auto-stop recording when the iframe signals the end */
window.addEventListener('message', e=>{
  if(e.data && e.data.gigScene==='end'){
    setTimeout(()=>{ if(mediaRec && mediaRec.state!=='inactive') mediaRec.stop(); }, 1200);
  }
});

$('playBtn').onclick = ()=>start(false);
$('recBtn').onclick  = ()=>start(true);
</script>
</body>
</html>
