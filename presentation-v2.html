<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>GIG — Presentation V2 (2 دقيقة)</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Kufam:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a14;font-family:'Almarai',sans-serif;}

/* ── 1920×1080 stage, scaled to fit ── */
#stage{
  width:1920px;height:1080px;position:fixed;top:0;left:0;
  transform-origin:top left;overflow:hidden;
}
#bg{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}

/* ── 3D tablet ── */
#tablet-wrap{
  position:absolute;left:150px;top:95px;
  width:1045px;height:825px;
  perspective:1800px;perspective-origin:50% 50%;
}
#tablet{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  border-radius:34px;
  background:linear-gradient(155deg,#15151c 0%,#26262f 48%,#15151c 100%);
  box-shadow:
    0 60px 120px -30px rgba(10,8,40,.55),
    0 30px 60px -20px rgba(10,8,40,.4),
    inset 0 0 0 2px rgba(255,255,255,.05);
  padding:26px;
}
/* subtle camera bump / front speaker */
#tablet::before{
  content:'';position:absolute;top:50%;right:11px;transform:translateY(-50%);
  width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle,#3a3a45,#15151c);
}
#screen{
  width:100%;height:100%;border-radius:14px;overflow:hidden;
  background:#fff;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
}
#screen iframe{
  width:100%;height:100%;border:0;display:block;background:#fff;
}
/* soft screen glare */
#glare{
  position:absolute;inset:0;pointer-events:none;border-radius:14px;
  background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 28%);
  opacity:.6;
}

/* ── right-side headlines ── */
#head{
  position:absolute;right:75px;top:0;height:1080px;width:560px;
  display:flex;flex-direction:column;justify-content:center;
  align-items:flex-end;padding-bottom:420px;
}
#eyebrow{
  font-family:'Almarai',sans-serif;font-weight:700;font-size:21px;
  color:#d28c64;letter-spacing:.5px;margin-bottom:14px;opacity:0;
  width:100%;direction:rtl;text-align:right;unicode-bidi:isolate;
}
#title{
  font-family:'Kufam',sans-serif;font-weight:900;font-size:52px;
  line-height:1.2;color:#19058c;opacity:0;
  width:100%;direction:rtl;text-align:right;unicode-bidi:isolate;
}
#subtitle{
  font-family:'Almarai',sans-serif;font-weight:300;font-size:24px;
  line-height:1.6;color:rgba(25,5,140,.58);margin-top:20px;opacity:0;
  width:100%;direction:rtl;text-align:right;unicode-bidi:isolate;
  min-height:44px;
}

/* ── address-bar intro ── */
#addrbar{
  position:absolute;inset:0;
  z-index:20;pointer-events:none;opacity:0;
}
#ab-glow{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:1000px;height:560px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(210,140,100,.22) 0%,rgba(25,5,140,.12) 38%,rgba(25,5,140,0) 70%);
  filter:blur(36px);opacity:0;pointer-events:none;z-index:1;
}
#addrbar-center{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:16px;
  z-index:2;
}
#addrbar-pill{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  backdrop-filter:blur(22px) saturate(140%);
  border-radius:60px;
  padding:24px 46px;width:780px;height:88px;
  box-shadow:
    0 44px 110px rgba(10,8,40,.26),
    0 10px 34px rgba(10,8,40,.14),
    inset 0 1.5px 0 rgba(255,255,255,.75);
  border:1.5px solid rgba(255,255,255,.7);
}
#ab-lock{
  position:absolute;left:40px;
  display:flex;align-items:center;opacity:.75;
}
#ab-url{
  font-family:'Almarai',sans-serif;font-weight:400;font-size:30px;
  color:#19058c;letter-spacing:.5px;direction:ltr;white-space:nowrap;
  text-align:center;
}
#ab-cursor{
  width:2.5px;height:32px;background:#19058c;
  border-radius:2px;flex-shrink:0;display:inline-block;
}
#ab-progress{
  position:absolute;bottom:0;left:0;
  width:0%;height:3px;
  background:linear-gradient(90deg,#19058c 0%,#7b5bd6 55%,#d28c64 100%);
  border-radius:0 0 60px 60px;
  box-shadow:0 0 10px rgba(123,91,214,.7);
  opacity:0;
}
#ab-flash{
  position:absolute;inset:0;background:#fff;opacity:0;
  z-index:30;pointer-events:none;
}

/* ── intro title card (very first scene) ── */
#intro-title{
  position:absolute;inset:0;z-index:60;
  display:flex;align-items:center;justify-content:center;
  background:#fff url('images/bg-presentation.png') center/cover no-repeat;
  opacity:0;pointer-events:none;
}
#it-glow{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:1100px;height:620px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(210,140,100,.20) 0%,rgba(25,5,140,.11) 40%,rgba(25,5,140,0) 72%);
  filter:blur(44px);opacity:0;
}
#it-stack{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:30px;
}
#it-text{
  font-family:'Kufam',sans-serif;font-weight:900;
  font-size:66px;line-height:1.3;color:#19058c;
  text-align:center;direction:rtl;
  text-shadow:0 18px 50px rgba(25,5,140,.14);
}
#it-text .it-word{ display:inline-block; margin:0 12px; }
#it-text .it-brand{ color:#19058c; }
#it-line{
  width:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,rgba(25,5,140,0) 0%,#19058c 28%,#d28c64 72%,rgba(210,140,100,0) 100%);
  opacity:0;
}

/* ── outro / end card ── */
#outro{
  position:absolute;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;
  background:radial-gradient(ellipse at 50% 46%, #ffffff 0%, #f5f2fc 52%, #ece6f7 100%);
  opacity:0;pointer-events:none;
}
#outro-glow{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:1100px;height:700px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(210,140,100,.55) 0%,rgba(25,5,140,.28) 42%,rgba(25,5,140,0) 72%);
  filter:blur(48px);opacity:0;
}
#outro-logo{
  position:relative;z-index:2;width:460px;height:auto;object-fit:contain;opacity:0;
  filter:drop-shadow(0 26px 64px rgba(25,5,140,.22));
}
#outro-line{
  position:relative;z-index:2;width:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(25,5,140,0) 0%,#19058c 30%,#d28c64 70%,rgba(210,140,100,0) 100%);
  opacity:0;
}
#outro-url{
  position:relative;z-index:2;
  font-family:'Almarai',sans-serif;font-weight:700;font-size:30px;
  color:#19058c;letter-spacing:3px;direction:ltr;opacity:0;
}

/* ── tablet light sweep ── */
#tablet-shine{
  position:absolute;inset:0;border-radius:14px;
  pointer-events:none;z-index:7;
}
#shine-beam{
  position:absolute;top:-15%;left:0;
  width:44%;height:130%;
  background:linear-gradient(
    108deg,
    transparent 0%,
    rgba(255,255,255,0)   18%,
    rgba(255,255,255,.10) 40%,
    rgba(255,255,255,.22) 50%,
    rgba(255,255,255,.10) 60%,
    rgba(255,255,255,0)   82%,
    transparent 100%
  );
  transform:skewX(-8deg);
  opacity:0;pointer-events:none;
}

/* ── controls ── */
.pbtn{
  position:fixed;z-index:99999;border:none;border-radius:10px;cursor:pointer;
  font:700 15px Almarai,sans-serif;color:#fff;padding:12px 20px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#playBtn{top:14px;left:14px;background:#19058c;}
#recBtn {top:14px;left:150px;background:#c0392b;}
.pbtn.hide{display:none;}
</style>
</head>
<body>

<div id="stage">
  <img id="bg" src="images/bg-presentation.png" alt="">

  <!-- intro title card (very first scene) -->
  <div id="intro-title">
    <div id="it-glow"></div>
    <div id="it-stack">
      <div id="it-text">
        <span class="it-word">تقديم</span>
        <span class="it-word">مطالبات</span>
        <span class="it-word">التأمين</span>
        <span class="it-word">مع</span>
        <span class="it-word it-brand">جي آي جي</span>
      </div>
      <div id="it-line"></div>
    </div>
  </div>

  <!-- address-bar intro overlay -->
  <div id="addrbar">
    <div id="ab-glow"></div>
    <div id="addrbar-center">
      <div id="addrbar-pill">
        <div id="ab-progress"></div>
        <span id="ab-lock">
          <svg width="20" height="22" viewBox="0 0 18 20" fill="none">
            <rect x="1.5" y="8.5" width="15" height="11" rx="2.5" stroke="#19058c" stroke-width="1.6" fill="none"/>
            <path d="M4.5 8.5V6A4.5 4.5 0 0 1 13.5 6v2.5" stroke="#19058c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <circle cx="9" cy="14" r="1.8" fill="#19058c"/>
          </svg>
        </span>
        <span id="ab-url"></span>
        <span id="ab-cursor"></span>
      </div>
    </div>
  </div>
  <div id="ab-flash"></div>

  <!-- outro / end card overlay -->
  <div id="outro">
    <div id="outro-glow"></div>
    <img id="outro-logo" src="https://www.gig.sa/media/wydptuu1/gig_fairfax-company.png" alt="GIG">
    <div id="outro-line"></div>
    <div id="outro-url">www.gig.sa</div>
  </div>

  <div id="tablet-wrap">
    <div id="tablet">
      <div id="screen">
        <iframe id="frame" src="index-tablet-v2.html?embed" title="GIG"></iframe>
        <div id="glare"></div>
        <div id="tablet-shine"><div id="shine-beam"></div></div>
      </div>
    </div>
  </div>

  <div id="head">
    <div id="eyebrow"></div>
    <div id="title"></div>
    <div id="subtitle"></div>
  </div>
</div>

<button id="playBtn" class="pbtn">▶ تشغيل العرض</button>
<button id="recBtn"  class="pbtn">● تسجيل وحفظ</button>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage'), frame = $('frame');

/* ── headline copy per scene (easy to edit) ── */
const HEAD = {
  s1:       { eye:'آلية تقديم المطالبات', t:'التحقق من هوية الأفراد' },
  otp:      { eye:'آلية تقديم المطالبات', t:'رمز التحقق الأمني' },
  s3:       { eye:'آلية تقديم المطالبات', t:'التحقق — الشركات والبنوك' },
  najm:     { eye:'تفاصيل الحادث',        t:'المطالبة عبر تقرير نجم' },
  basher:   { eye:'تفاصيل الحادث',        t:'المطالبة عبر باشر / المرور' },
  other:    { eye:'تفاصيل الحادث',        t:'المطالبة لعملاء جي آي جي' },
  estimate: { eye:'تقدير الأضرار',        t:'التقدير والبيانات البنكية' },
  review:   { eye:'الخطوة الأخيرة',       t:'مراجعة وتقديم المطالبة' },
  end:      { eye:'',                      t:'' }
};

/* ── scale stage to viewport (contain) ── */
function scaleStage(){
  const sc = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  const tx = (window.innerWidth-1920*sc)/2, ty=(window.innerHeight-1080*sc)/2;
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
}
scaleStage(); window.addEventListener('resize',scaleStage);

/* ── tablet resting pose + hidden start ── */
function setTabletStart(){
  gsap.set('#tablet',{y:920, rotationY:0, rotationX:0, x:0, z:0, scale:1, opacity:0, transformOrigin:'50% 50%'});
  gsap.set(['#eyebrow','#title','#subtitle'],{opacity:0});
}
setTabletStart();

function tabletEnter(){
  return new Promise(res=>{
    const tl = gsap.timeline({onComplete:res});
    tl.to('#tablet',{y:0, opacity:1, duration:1.1, ease:'power3.out'})
      .to('#tablet',{y:-5, duration:0.35, ease:'sine.inOut'},'-=0.05')
      .to('#tablet',{y:0,  duration:0.25, ease:'sine.inOut'});
  });
}

/* ── headline switching ── */
let curKey=null;
function showHead(key){
  if(key===curKey) return; curKey=key;
  const h = HEAD[key]; if(!h) return;
  const tl = gsap.timeline();
  /* soft exit — drift up gently */
  tl.to('#eyebrow',  {opacity:0, y:-10, duration:.55, ease:'power2.inOut'})
    .to('#title',    {opacity:0, y:-8,  duration:.55, ease:'power2.inOut'}, '-=0.45')
    .to('#subtitle', {opacity:0,        duration:.3,  ease:'power1.in'},   '-=0.35');

  /* end scene: just fade out, nothing new to animate in */
  if(!h.t && !h.eye){ curAction=null; return; }

  tl.add(()=>{
      $('eyebrow').textContent  = h.eye;
      $('title').textContent    = h.t;
      $('subtitle').textContent = '';
      curAction = null;
    })
    /* silky entrance — each element glides in from below */
    .fromTo('#eyebrow', {opacity:0,y:14},{opacity:(h.eye?1:0),y:0,duration:.65,ease:'power4.out'})
    .fromTo('#title',   {opacity:0,y:18},{opacity:(h.t?1:0),  y:0,duration:.8, ease:'power4.out'},'-=0.45')
    .set('#subtitle',{opacity:0,y:0});
}

/* ── live action caption: updates ONLY subtitle — glides in, never shifts layout ── */
let curAction=null;
function showAction(txt){
  if(txt===curAction) return; curAction=txt;
  const el=$('subtitle');
  gsap.killTweensOf(el);
  gsap.to(el,{opacity:0, duration:.18, ease:'power1.in',
    onComplete:()=>{
      el.textContent=txt||'';
      gsap.fromTo(el,{opacity:0, y:10},{opacity:(txt?1:0), y:0, duration:.55, ease:'power4.out'});
    }
  });
}

window.addEventListener('message', e=>{
  if(!e.data) return;
  if(e.data.gigScene){ showHead(e.data.gigScene); if(e.data.gigScene!=='end') playVO(voForScene(e.data.gigScene)); }
  if(typeof e.data.gigAction==='string') showAction(e.data.gigAction);
});

/* ── premium tech sound design (Apple-inspired — pure sine, subtle, precise) ── */
function getAudio(){
  try{
    const fw=frame.contentWindow;
    const ctx=fw.getACtx(); fw.getMaster();
    const dest=fw._softBus || ctx.destination;
    return {ctx,dest};
  }catch(e){ return null; }
}

/* soft sine sweep — clean modal "appear" feel */
function sfxAppear(a){
  const {ctx,dest}=a, t=ctx.currentTime;
  const o=ctx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(1800,t);
  o.frequency.exponentialRampToValueAtTime(3200,t+.28);
  const g=ctx.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.045,t+.05);
  g.gain.exponentialRampToValueAtTime(.0001,t+.28);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t+.3);
}

/* ultra-clean keyboard tock — MacBook-style */
function sfxKey(a){
  const {ctx,dest}=a, t=ctx.currentTime;
  /* mechanical body (low transient) */
  const lo=ctx.createOscillator(); lo.type='sine';
  lo.frequency.setValueAtTime(340,t);
  lo.frequency.exponentialRampToValueAtTime(180,t+.022);
  const lg=ctx.createGain();
  lg.gain.setValueAtTime(.0001,t); lg.gain.exponentialRampToValueAtTime(.038,t+.003);
  lg.gain.exponentialRampToValueAtTime(.0001,t+.022);
  lo.connect(lg); lg.connect(dest); lo.start(t); lo.stop(t+.025);
  /* click transient (high sine) */
  const hi=ctx.createOscillator(); hi.type='sine';
  hi.frequency.setValueAtTime(3800,t);
  hi.frequency.exponentialRampToValueAtTime(2600,t+.018);
  const hg=ctx.createGain();
  hg.gain.setValueAtTime(.0001,t); hg.gain.exponentialRampToValueAtTime(.022,t+.002);
  hg.gain.exponentialRampToValueAtTime(.0001,t+.018);
  hi.connect(hg); hg.connect(dest); hi.start(t); hi.stop(t+.02);
}

/* two-tone ascending chime — Apple notification quality */
function sfxChime(a){
  const {ctx,dest}=a, t=ctx.currentTime;
  [[1047,.0],[1319,.09],[1568,.18]].forEach(([f,dt])=>{
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=ctx.createGain(); const st=t+dt;
    g.gain.setValueAtTime(.0001,st);
    g.gain.exponentialRampToValueAtTime(.055,st+.012);
    g.gain.exponentialRampToValueAtTime(.0001,st+.55);
    o.connect(g); g.connect(dest); o.start(st); o.stop(st+.6);
  });
}

/* launch — clean ascending sweep + gentle arpeggio (iOS/macOS quality) */
function sfxLaunch(a){
  const {ctx,dest}=a, t=ctx.currentTime;
  /* clean pitch sweep */
  const sw=ctx.createOscillator(); sw.type='sine';
  sw.frequency.setValueAtTime(520,t);
  sw.frequency.exponentialRampToValueAtTime(2080,t+.38);
  const sg=ctx.createGain();
  sg.gain.setValueAtTime(.0001,t);
  sg.gain.exponentialRampToValueAtTime(.055,t+.04);
  sg.gain.exponentialRampToValueAtTime(.0001,t+.38);
  sw.connect(sg); sg.connect(dest); sw.start(t); sw.stop(t+.4);
  /* staggered arpeggio — C major (clean, universal, uplifting) */
  [[523.25,.06],[659.25,.13],[783.99,.20],[1046.5,.28]].forEach(([f,dt])=>{
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=ctx.createGain(); const st=t+dt;
    g.gain.setValueAtTime(.0001,st);
    g.gain.exponentialRampToValueAtTime(.05,st+.015);
    g.gain.exponentialRampToValueAtTime(.0001,st+.75);
    o.connect(g); g.connect(dest); o.start(st); o.stop(st+.8);
  });
}

/* ── tablet light sweep ── fires once after tablet finishes entering */
function tabletShine(){
  gsap.set('#shine-beam',{xPercent:-120,opacity:1});
  gsap.to('#shine-beam',{
    xPercent:230, duration:1.05, ease:'power1.inOut',
    onComplete:()=>gsap.set('#shine-beam',{opacity:0})
  });
}

/* ── address bar intro ── */
function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function addressBarIntro(){
  const urlEl=$('ab-url'), curEl=$('ab-cursor');
  const a=getAudio();

  /* reset everything */
  urlEl.textContent='';
  gsap.set('#addrbar',{display:'block',opacity:1});
  gsap.set('#addrbar-center',{y:50,scale:.88,opacity:0});
  gsap.set('#ab-glow',{opacity:0,scale:.6});
  gsap.set('#ab-progress',{width:'0%',opacity:0});
  gsap.set(curEl,{opacity:1});
  gsap.set('#ab-flash',{opacity:0});

  /* 1. glow builds slowly in background */
  gsap.to('#ab-glow',{opacity:1,scale:1,duration:2.2,ease:'power2.out'});

  /* 2. pill glides in from below */
  await delay(150);
  if(a) sfxAppear(a);
  await new Promise(res=>gsap.to('#addrbar-center',{
    y:0,scale:1,opacity:1,duration:.85,ease:'back.out(1.4)',onComplete:res
  }));

  await delay(280);

  /* 3. cursor blinks, then URL types character by character */
  const blinkTween=gsap.to(curEl,{opacity:0,duration:.45,repeat:-1,yoyo:true,ease:'power1.inOut'});
  const url='www.gig.sa';
  for(let i=0;i<=url.length;i++){
    urlEl.textContent=url.slice(0,i);
    if(a && i>0) sfxKey(a);
    await delay(i===0?320:78);
  }

  /* 4. pause after typing completes, cursor stops */
  await delay(480);
  blinkTween.kill();
  gsap.set(curEl,{opacity:0});

  /* 5. progress line fades in on the bar itself */
  gsap.to('#ab-progress',{opacity:1,duration:.28,ease:'power2.out'});
  await delay(100);

  /* 6. sweep across the bottom of the pill like Chrome — chime at start */
  if(a) sfxChime(a);
  await new Promise(res=>gsap.to('#ab-progress',{width:'100%',duration:1.15,ease:'power2.inOut',onComplete:res}));

  await delay(360);

  /* 7. cinematic exit: scale up + fade, then flash */
  if(a) sfxLaunch(a);
  await new Promise(res=>{
    const tl=gsap.timeline({onComplete:res});
    tl.to('#addrbar-center',{scale:1.1,opacity:0,duration:.6,ease:'power2.in'},0)
      .to('#ab-glow',{scale:1.45,opacity:0,duration:.65,ease:'power2.in'},0)
      .to('#ab-flash',{opacity:.8,duration:.16,ease:'power2.out'},.1)
      .to('#ab-flash',{opacity:0,duration:.55,ease:'power2.in'},'>');
  });
  gsap.set('#addrbar',{display:'none'});
}

/* ── start the show (with optional recording) ── */
let mediaRec=null, recChunks=[], recTap=null;

/* ── background music — routed through the iframe's soft bus so it is
   both audible AND captured by the recorder; fades in/out gracefully ── */
const MUSIC_FILE = 'Interview%2001.mp3';   /* URL-encoded (space → %20) */
const MUSIC_VOL  = 0.18;                    /* level under the SFX / VO  */
let musicSrc=null, musicGain=null;
async function startMusic(){
  try{
    const fw  = frame.contentWindow;
    const ctx = fw.getACtx(); fw.getMaster();           /* ensure soft bus exists */
    const bus = fw._softBus || ctx.destination;
    const res = await fetch(MUSIC_FILE);
    if(!res.ok){ console.warn('music not found:', MUSIC_FILE); return; }
    const buf = await ctx.decodeAudioData(await res.arrayBuffer());
    musicSrc = ctx.createBufferSource();
    musicSrc.buffer = buf; musicSrc.loop = true;        /* loop if shorter than 2 min */
    musicGain = ctx.createGain();
    const t = ctx.currentTime;
    musicGain.gain.setValueAtTime(0.0001, t);
    musicGain.gain.exponentialRampToValueAtTime(MUSIC_VOL, t+2.2);   /* fade in */
    musicSrc.connect(musicGain); musicGain.connect(bus);
    musicSrc.start(t);
  }catch(e){ console.warn('music error:', e); }
}
function stopMusic(){
  if(!musicGain) return;
  const ctx=musicGain.context, t=ctx.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(musicGain.gain.value, t);
  musicGain.gain.linearRampToValueAtTime(0.0001, t+3.0);            /* fade out */
  try{ musicSrc.stop(t+3.2); }catch(e){}
  musicSrc=null; musicGain=null;
}

/* ── voice-over: per-scene segments played in sync with each scene ──
   Files are optional — if one is missing, nothing plays (no error).
   Routed through the iframe's soft bus so the recorder captures it. */
const VO_VOL = 0.82;            /* narration level — clear but not overpowering */
const VO_DUCK = 0.06;           /* music level while narration plays             */
const VO_MAP = {
  s1:       'VO1/vo-02-individuals.mp3',
  s3:       'VO1/vo-03-company.mp3',
  otp:      'VO1/vo-04-otp.mp3',
  najm:     'VO1/vo-05-najm.mp3',
  estimate: ['VO1/vo-06-estimate.mp3','VO1/vo-10-estimate-final.mp3'],  /* runs twice */
  review:   ['VO1/vo-07-review.mp3','VO1/vo-11-review-final.mp3'],      /* runs twice */
  basher:   'VO1/vo-08-basher.mp3',
  other:    'VO1/vo-09-other.mp3'
};
let voSrc=null, voGain=null, voSeen={};
function voForScene(key){
  const m=VO_MAP[key]; if(!m) return null;
  if(Array.isArray(m)){ const i=voSeen[key]||0; voSeen[key]=i+1; return m[Math.min(i,m.length-1)]; }
  return m;
}
function stopVO(){
  if(voSrc){ try{ voSrc.onended=null; voSrc.stop(); }catch(e){} }
  voSrc=null; voGain=null;
}
async function playVO(file){
  if(!file) return;
  try{
    const fw=frame.contentWindow;
    const ctx=fw.getACtx(); fw.getMaster();
    const bus=fw._softBus||ctx.destination;
    const res=await fetch(file);
    if(!res.ok) return;                       /* not uploaded yet — skip */
    const buf=await ctx.decodeAudioData(await res.arrayBuffer());
    stopVO();                                 /* cut any previous segment */
    voSrc=ctx.createBufferSource(); voSrc.buffer=buf;
    voGain=ctx.createGain(); voGain.gain.value=VO_VOL;
    voSrc.connect(voGain); voGain.connect(bus);
    /* duck the music under the narration */
    if(musicGain){
      const t=musicGain.context.currentTime;
      musicGain.gain.cancelScheduledValues(t);
      musicGain.gain.setValueAtTime(musicGain.gain.value,t);
      musicGain.gain.linearRampToValueAtTime(VO_DUCK,t+0.4);
    }
    /* restore music smoothly when narration ends */
    voSrc.onended=()=>{
      if(musicGain){
        const t=musicGain.context.currentTime;
        musicGain.gain.cancelScheduledValues(t);
        musicGain.gain.setValueAtTime(musicGain.gain.value,t);
        musicGain.gain.linearRampToValueAtTime(MUSIC_VOL,t+0.8);
      }
    };
    voSrc.start(ctx.currentTime);
  }catch(e){ /* ignore */ }
}

async function start(record, btn){
  $('playBtn').classList.add('hide'); $('recBtn').classList.add('hide');

  /* reset intro/outro + music + voice-over state (allows replay) */
  outroDone=false;
  voSeen={}; stopVO();
  gsap.set('#outro',{opacity:0,display:'none'});
  gsap.set('#intro-title',{opacity:0,display:'none'});
  stopMusic();

  const fw = frame.contentWindow;

  /* resume the iframe's audio engine on this user gesture */
  try{ const c = fw.getACtx(); if(c.state==='suspended') await c.resume(); }catch(e){}

  /* kick off background music from 0:00 (fire-and-forget; fades in) */
  startMusic();

  if(record){
    try{
      const display = await navigator.mediaDevices.getDisplayMedia({
        video:{ frameRate:60, width:1920, height:1080 }, audio:false });
      const ctx = fw.getACtx(); fw.getMaster();
      if(!recTap){ recTap = ctx.createMediaStreamDestination(); fw._softBus.connect(recTap); }
      const stream = new MediaStream([...display.getVideoTracks(), ...recTap.stream.getAudioTracks()]);
      const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
        ? 'video/webm;codecs=vp9,opus' : 'video/webm';
      mediaRec = new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:16000000});
      recChunks=[];
      mediaRec.ondataavailable=ev=>{ if(ev.data.size) recChunks.push(ev.data); };
      mediaRec.onstop=()=>{
        const blob=new Blob(recChunks,{type:'video/webm'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob); a.download='gig-presentation.webm'; a.click();
        display.getTracks().forEach(t=>t.stop());
      };
      mediaRec.start();
    }catch(err){ alert('تعذّر بدء التسجيل: '+err.message); }
  }

  /* 0) opening title, 1) address bar types URL, 2) tablet rises while the
     scene builds inside it, settling just before the cursor enters */
  await showIntroTitle();
  await addressBarIntro();
  showHead('s1');
  const entering = tabletEnter();          /* start the rise (don't block) */
  await delay(450);                        /* a beat into the climb */
  try{ fw.run(); }catch(e){}               /* build the page while it rises */
  await entering;                          /* tablet settles, page is ready */
  tabletShine();                           /* light sweep on the settled tablet */
}

/* ── opening title card: "تقديم مطالبات التأمين مع جي آي جي" ── */
async function showIntroTitle(){
  const a=getAudio();
  playVO('VO1/vo-01-intro.mp3');           /* intro narration starts with the title card */
  gsap.set('#intro-title',{opacity:0,display:'flex'});
  gsap.set('#it-glow',{opacity:0,scale:.72});
  gsap.set('#it-text .it-word',{opacity:0,y:28});
  gsap.set('#it-line',{opacity:0,width:0});

  /* 1. background fades in */
  await new Promise(res=>gsap.to('#intro-title',{opacity:1,duration:.6,ease:'power2.out',onComplete:res}));

  /* 2. glow blooms */
  gsap.to('#it-glow',{opacity:1,scale:1,duration:1.8,ease:'power2.out'});

  /* 3. words rise in, right-to-left, with a soft chime */
  if(a) sfxAppear(a);
  await new Promise(res=>gsap.to('#it-text .it-word',
    {opacity:1,y:0,duration:.7,stagger:.09,ease:'power4.out',onComplete:res}));

  /* 4. accent line draws out */
  await new Promise(res=>gsap.to('#it-line',
    {opacity:1,width:320,duration:.55,ease:'power3.out',onComplete:res}));

  /* 5. hold */
  await delay(1100);

  /* 6. graceful exit → reveals the address bar */
  await new Promise(res=>{
    const tl=gsap.timeline({onComplete:res});
    tl.to('#it-text .it-word',{opacity:0,y:-20,duration:.5,stagger:.05,ease:'power2.in'},0)
      .to('#it-line',{opacity:0,duration:.4,ease:'power2.in'},0)
      .to('#it-glow',{opacity:0,scale:1.3,duration:.6,ease:'power2.in'},0)
      .to('#intro-title',{opacity:0,duration:.5,ease:'power2.in'},'-=0.15');
  });
  gsap.set('#intro-title',{display:'none'});
}

/* ── cinematic outro: brand logo end card ── */
async function showOutro(){
  const a=getAudio();
  playVO('VO1/vo-12-outro.mp3');             /* closing narration */
  gsap.set('#outro',{opacity:0,display:'flex'});
  gsap.set('#outro-glow',{opacity:0,scale:.72});
  gsap.set('#outro-logo',{opacity:0,scale:.84,y:16});
  gsap.set('#outro-line',{opacity:0,width:0});
  gsap.set('#outro-url',{opacity:0,y:16});

  /* 1. light background fades in */
  await new Promise(res=>gsap.to('#outro',{opacity:1,duration:.7,ease:'power2.out',onComplete:res}));

  /* 2. glow blooms behind logo */
  gsap.to('#outro-glow',{opacity:1,scale:1,duration:1.6,ease:'power2.out'});
  await delay(600);   /* let the glow partially bloom before the logo appears */

  /* 3. logo reveal + chime */
  if(a) sfxChime(a);
  await new Promise(res=>gsap.to('#outro-logo',
    {opacity:1,scale:1,y:0,duration:.95,ease:'back.out(1.5)',onComplete:res}));

  /* 4. accent line draws out */
  await new Promise(res=>gsap.to('#outro-line',
    {opacity:1,width:340,duration:.6,ease:'power3.out',onComplete:res}));

  /* 5. url fades in — bookends the intro */
  await new Promise(res=>gsap.to('#outro-url',
    {opacity:1,y:0,duration:.55,ease:'power3.out',onComplete:res}));

  /* 6. hold */
  await delay(2200);
}

/* run the outro then stop recording when the iframe signals the end */
let outroDone=false;
window.addEventListener('message', async e=>{
  if(e.data && e.data.gigScene==='end' && !outroDone){
    outroDone=true;
    stopMusic();          /* fade music out as the outro begins */
    await delay(700);
    await showOutro();
    window.__outroEnd = performance.now();
    if(mediaRec && mediaRec.state!=='inactive') mediaRec.stop();
  }
});

$('playBtn').onclick = ()=>start(false);
$('recBtn').onclick  = ()=>start(true);
</script>
