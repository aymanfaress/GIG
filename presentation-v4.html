<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>GIG — Presentation V4 (≤60 ث)</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
@property --ab-angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a14;font-family:'Almarai',sans-serif;}

/* ── 1920×1080 stage, scaled to fit ── */
#stage{
  width:1920px;height:1080px;position:fixed;top:0;left:0;
  transform-origin:top left;overflow:hidden;
}
#bg{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}

/* ── 3D tablet ── */
#tablet-wrap{
  position:absolute;left:150px;top:95px;
  width:1045px;height:825px;
  perspective:1800px;perspective-origin:50% 50%;
}
#tablet{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  border-radius:34px;
  background:linear-gradient(155deg,#15151c 0%,#26262f 48%,#15151c 100%);
  box-shadow:
    0 60px 120px -30px rgba(10,8,40,.55),
    0 30px 60px -20px rgba(10,8,40,.4),
    inset 0 0 0 2px rgba(255,255,255,.05);
  padding:26px;
}
/* subtle camera bump / front speaker */
#tablet::before{
  content:'';position:absolute;top:50%;right:11px;transform:translateY(-50%);
  width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle,#3a3a45,#15151c);
}
#screen{
  width:100%;height:100%;border-radius:14px;overflow:hidden;
  background:#fff;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
}
#screen iframe{
  width:100%;height:100%;border:0;display:block;background:#fff;
}
/* soft screen glare */
#glare{
  position:absolute;inset:0;pointer-events:none;border-radius:14px;
  background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 28%);
  opacity:.6;
}

/* ── right-side headlines ── */
#head{
  position:absolute;right:75px;top:0;height:1080px;width:560px;
  display:flex;flex-direction:column;justify-content:center;
  align-items:flex-end;padding-top:360px;padding-bottom:0;
}
#eyebrow{
  font-family:'Almarai',sans-serif;font-weight:700;font-size:21px;
  color:#d28c64;letter-spacing:.5px;margin-bottom:14px;opacity:0;
  width:100%;direction:rtl;text-align:right;unicode-bidi:isolate;
}
#title{
  font-family:'Almarai',sans-serif;font-weight:900;font-size:52px;
  line-height:1.2;color:#19058c;opacity:0;
  width:100%;direction:rtl;text-align:right;unicode-bidi:isolate;
}
#subtitle{
  font-family:'Almarai',sans-serif;font-weight:300;font-size:24px;
  line-height:1.6;color:rgba(25,5,140,.58);margin-top:20px;opacity:0;
  width:100%;direction:rtl;text-align:right;unicode-bidi:isolate;
  min-height:44px;
}

/* ── section interstitial (full-screen divider before najm / المرور / أخرى) ── */
#interstitial{
  position:absolute;inset:0;z-index:58;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:44px;
  background:#fff url('images/bg-presentation.png') center/cover no-repeat;
  padding-bottom:30px;
}
#ist-icon{
  width:156px;height:156px;object-fit:contain;border-radius:32px;
  box-shadow:0 26px 64px rgba(25,5,140,.16);
}
#ist-text{
  font-family:'Almarai',sans-serif;font-weight:800;font-size:56px;
  color:#19058c;text-align:center;direction:rtl;
  text-shadow:0 14px 40px rgba(25,5,140,.10);
}

/* ── address-bar intro ── */
#addrbar{
  position:absolute;inset:0;
  z-index:20;pointer-events:none;opacity:0;
}
#ab-glow{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:1000px;height:560px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(210,140,100,.22) 0%,rgba(25,5,140,.12) 38%,rgba(25,5,140,0) 70%);
  filter:blur(36px);opacity:0;pointer-events:none;z-index:1;
}
#addrbar-center{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:16px;
  z-index:2;
}
#addrbar-pill{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  backdrop-filter:blur(22px) saturate(140%);
  border-radius:60px;
  padding:24px 46px;width:780px;height:88px;
  box-shadow:
    0 44px 110px rgba(10,8,40,.26),
    0 10px 34px rgba(10,8,40,.14),
    inset 0 1.5px 0 rgba(255,255,255,.75);
  border:1.5px solid rgba(255,255,255,.7);
}
#ab-lock{
  position:absolute;left:40px;
  display:flex;align-items:center;opacity:.75;
}
#ab-url{
  font-family:'Almarai',sans-serif;font-weight:400;font-size:30px;
  color:#19058c;letter-spacing:.5px;direction:ltr;white-space:nowrap;
  text-align:center;
}
#ab-cursor{
  width:2.5px;height:32px;background:#19058c;
  border-radius:2px;flex-shrink:0;display:inline-block;
}
#addrbar-pill-wrap{
  position:relative;
}
#ab-ring{
  position:absolute;
  left:-6px;top:-6px;
  width:792px;height:100px;
  opacity:0;
  z-index:0;
  pointer-events:none;
  overflow:visible;
  filter:drop-shadow(0 0 10px rgba(25,5,140,.75));
}
@keyframes pill-trace{
  from{ stroke-dashoffset:0; }
  to  { stroke-dashoffset:-1662; }
}
#ab-ring-path.running{
  animation:pill-trace 3s linear forwards;
}
#ab-flash{
  position:absolute;inset:0;background:#fff;opacity:0;
  z-index:30;pointer-events:none;
}

/* ── intro title card (very first scene) ── */
#intro-title{
  position:absolute;inset:0;z-index:60;
  display:flex;align-items:center;justify-content:center;
  background:#fff url('images/bg-presentation.png') center/cover no-repeat;
  opacity:0;pointer-events:none;
}
#it-glow{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:1100px;height:620px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(210,140,100,.20) 0%,rgba(25,5,140,.11) 40%,rgba(25,5,140,0) 72%);
  filter:blur(44px);opacity:0;
}
#it-stack{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:30px;
}
#ij-stage{ position:relative; width:520px; height:170px; }
#ij-stage .ij-ic, #ij-bar{ position:absolute; left:50%; top:50%; opacity:0; }
#it-cars{ position:absolute; left:50%; top:50%; width:420px; height:120px; margin-left:-210px; margin-top:-60px; }
#it-cars .car{ position:absolute; top:50%; left:50%; width:150px; height:100px; margin-top:-50px; margin-left:-75px; }
#it-crash{ position:absolute; top:50%; left:50%; width:96px; height:96px; margin-top:-52px; margin-left:-48px; opacity:0; pointer-events:none; }
#ij-shield{ width:120px; height:134px; margin-left:-60px; margin-top:-67px; }
#ij-list{ width:152px; height:120px; margin-left:-76px; margin-top:-60px; }
#ij-docs{ width:176px; height:150px; margin-left:-88px; margin-top:-75px; }
#ij-money{ width:188px; height:128px; margin-left:-94px; margin-top:-64px; }
#ij-bar{
  width:360px; margin-left:-180px; margin-top:-34px;
  display:flex; align-items:center; justify-content:center; gap:13px;
  background:#fff; border:1.5px solid rgba(25,5,140,.16); border-radius:44px;
  padding:17px 30px; box-shadow:0 18px 54px rgba(25,5,140,.16);
}
#ij-bar .ij-lock{ width:22px; height:22px; flex:none; }
#ij-url{ font-family:'Almarai',sans-serif; font-weight:700; font-size:30px; color:#19058c; direction:ltr; white-space:nowrap; letter-spacing:.5px; }
#ij-caret{ width:2.5px; height:30px; background:#19058c; border-radius:2px; flex:none; }
#ij-caption{
  font-family:'Almarai',sans-serif; font-weight:800; font-size:46px;
  color:#19058c; text-align:center; direction:rtl; line-height:1.45;
  opacity:0; max-width:1180px; margin-top:18px;
  text-shadow:0 14px 40px rgba(25,5,140,.10);
}

/* ── outro / end card ── */
#outro{
  position:absolute;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:#ffffff;
  opacity:0;pointer-events:none;
}
#outro-glow{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:1000px;height:560px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(210,140,100,.22) 0%,rgba(25,5,140,.12) 38%,rgba(25,5,140,0) 70%);
  filter:blur(36px);opacity:0;pointer-events:none;z-index:1;
}
#outro-logo{
  position:relative;z-index:2;width:420px;height:auto;object-fit:contain;opacity:0;
  filter:drop-shadow(0 20px 50px rgba(25,5,140,.18));
}
#outro-url{
  position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
  z-index:2;
  font-family:'Almarai',sans-serif;font-weight:700;font-size:28px;
  color:#19058c;letter-spacing:3px;direction:ltr;opacity:0;white-space:nowrap;
}

/* ── tablet light sweep ── */
#tablet-shine{
  position:absolute;inset:0;border-radius:14px;
  pointer-events:none;z-index:7;
}
#shine-beam{
  position:absolute;top:-15%;left:0;
  width:44%;height:130%;
  background:linear-gradient(
    108deg,
    transparent 0%,
    rgba(255,255,255,0)   18%,
    rgba(255,255,255,.10) 40%,
    rgba(255,255,255,.22) 50%,
    rgba(255,255,255,.10) 60%,
    rgba(255,255,255,0)   82%,
    transparent 100%
  );
  transform:skewX(-8deg);
  opacity:0;pointer-events:none;
}

/* ── controls ── */
.pbtn{
  position:fixed;z-index:99999;border:none;border-radius:10px;cursor:pointer;
  font:700 15px Almarai,sans-serif;color:#fff;padding:12px 20px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#playBtn{top:14px;left:14px;background:#19058c;}
#recBtn {top:14px;left:150px;background:#c0392b;}
.pbtn.hide{display:none;}

/* ── on-screen elapsed timer (shown only while previewing, hidden during recording) ── */
#vidTimer{
  position:fixed;top:14px;left:290px;z-index:99999;
  font:700 15px Almarai,sans-serif;color:#fff;
  background:#111;border-radius:10px;padding:12px 16px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  font-variant-numeric:tabular-nums;letter-spacing:.5px;display:none;
}
#vidTimer.show{display:block;}

/* ── start countdown overlay ── */
#countdown{
  position:fixed;inset:0;z-index:99998;
  display:none;align-items:center;justify-content:center;
  background:#0a0a14;
}
#cd-num{
  font-family:'Almarai',sans-serif;font-weight:900;
  font-size:300px;line-height:1;color:#fff;
  text-shadow:0 30px 90px rgba(25,5,140,.45);
}
</style>
</head>
<body>

  <!-- intro title card (very first scene) -->
  <div id="intro-title">

    <div id="it-stack">
      <div id="ij-stage">
        <div id="it-cars">
          <svg class="car carL" viewBox="0 0 156 104" fill="none" stroke="#17171b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">

              <line x1="66" y1="37" x2="66" y2="57"/>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage'), frame = $('frame');

/* ── headline copy per scene (easy to edit) ── */
const HEAD = {
  s1:       { eye:'آلية تقديم المطالبات', t:'التحقق من هوية الأفراد' },
  otp:      { eye:'آلية تقديم المطالبات', t:'رمز التحقق الأمني' },
  s3:       { eye:'آلية تقديم المطالبات', t:'التحقق — الشركات والبنوك' },
  najm:     { eye:'تفاصيل الحادث',        t:'المطالبة عبر تقرير نجم' },
  basher:   { eye:'تفاصيل الحادث',        t:'المطالبة عبر باشر / المرور' },
  other:    { eye:'تفاصيل الحادث',        t:'المطالبة لعملاء جي آي جي' },
  estimate: { eye:'تقدير الأضرار',        t:'التقدير والبيانات البنكية' },
  review:   { eye:'الخطوة الأخيرة',       t:'مراجعة وتقديم المطالبة' },
  end:      { eye:'',                      t:'' }
};

/* ── scale stage to viewport (contain) ── */
function scaleStage(){
  const sc = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  const tx = (window.innerWidth-1920*sc)/2, ty=(window.innerHeight-1080*sc)/2;
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
}
scaleStage(); window.addEventListener('resize',scaleStage);

/* ── tablet resting pose + hidden start ── */
function setTabletStart(){
  gsap.set('#tablet',{y:920, rotationY:0, rotationX:0, x:0, z:0, scale:1, opacity:0, transformOrigin:'50% 50%'});
  gsap.set(['#eyebrow','#title','#subtitle'],{opacity:0});
}
setTabletStart();

function tabletEnter(){
  return new Promise(res=>{
    const tl = gsap.timeline({onComplete:res});
    tl.to('#tablet',{y:0, opacity:1, duration:1.1, ease:'power3.out'})
      .to('#tablet',{y:-5, duration:0.35, ease:'sine.inOut'},'-=0.05')
      .to('#tablet',{y:0,  duration:0.25, ease:'sine.inOut'});
  });
}

/* ── headline switching ── */
let curKey=null;
function showHead(key){
  if(key===curKey) return; curKey=key;
  const h = HEAD[key]; if(!h) return;
  const tl = gsap.timeline();
  /* soft exit — drift up gently */
  tl.to('#eyebrow',  {opacity:0, y:-8, duration:.32, ease:'power2.in'})

    .to('#subtitle', {opacity:0,       duration:.22, ease:'power1.in'}, '-=0.26');

  if(!h.t && !h.eye){ curAction=null; return; }

      $('eyebrow').textContent  = h.eye;
      $('title').textContent    = h.t;
      $('subtitle').textContent = '';

    /* graceful entrance — glide in from below, lightly staggered */
    .fromTo('#eyebrow', {opacity:0,y:12},{opacity:(h.eye?1:0),y:0,duration:.5, ease:'power3.out'})
    .fromTo('#title',   {opacity:0,y:14},{opacity:(h.t?1:0),  y:0,duration:.55,ease:'power3.out'},'-=0.36')

/* ── premium tech sound design (Apple-inspired — pure sine, subtle, precise) ── */
function getAudio(){
  try{
    const fw=frame.contentWindow;
    const ctx=fw.getACtx(); fw.getMaster();
    const dest=fw._softBus || ctx.destination;
    return {ctx,dest};
  }catch(e){ return null; }
}

/* soft sine sweep — clean modal "appear" feel */
function sfxAppear(a){
  const {ctx,dest}=a, t=ctx.currentTime;
  const o=ctx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(1800,t);
  o.frequency.exponentialRampToValueAtTime(3200,t+.28);
  const g=ctx.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.045,t+.05);
  g.gain.exponentialRampToValueAtTime(.0001,t+.28);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t+.3);
}

/* ultra-clean keyboard tock — MacBook-style */
function sfxKey(a){
  const {ctx,dest}=a, t=ctx.currentTime;
  /* mechanical body (low transient) */
  const lo=ctx.createOscillator(); lo.type='sine';
  lo.frequency.setValueAtTime(340,t);
  lo.frequency.exponentialRampToValueAtTime(180,t+.022);
  const lg=ctx.createGain();
  lg.gain.setValueAtTime(.0001,t); lg.gain.exponentialRampToValueAtTime(.038,t+.003);
  lg.gain.exponentialRampToValueAtTime(.0001,t+.022);
  lo.connect(lg); lg.connect(dest); lo.start(t); lo.stop(t+.025);
  /* click transient (high sine) */
  const hi=ctx.createOscillator(); hi.type='sine';
  hi.frequency.setValueAtTime(3800,t);
  hi.frequency.exponentialRampToValueAtTime(2600,t+.018);
  const hg=ctx.createGain();
  hg.gain.setValueAtTime(.0001,t); hg.gain.exponentialRampToValueAtTime(.022,t+.002);
  hg.gain.exponentialRampToValueAtTime(.0001,t+.018);
  hi.connect(hg); hg.connect(dest); hi.start(t); hi.stop(t+.02);
}

/* two-tone ascending chime — Apple notification quality */
function sfxChime(a){
  const {ctx,dest}=a, t=ctx.currentTime;
  [[1047,.0],[1319,.09],[1568,.18]].forEach(([f,dt])=>{
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=ctx.createGain(); const st=t+dt;
    g.gain.setValueAtTime(.0001,st);
    g.gain.exponentialRampToValueAtTime(.055,st+.012);
    g.gain.exponentialRampToValueAtTime(.0001,st+.55);
    o.connect(g); g.connect(dest); o.start(st); o.stop(st+.6);
  });
}

/* launch — clean ascending sweep + gentle arpeggio (iOS/macOS quality) */
function sfxLaunch(a){
  const {ctx,dest}=a, t=ctx.currentTime;
  /* clean pitch sweep */
  const sw=ctx.createOscillator(); sw.type='sine';
  sw.frequency.setValueAtTime(520,t);
  sw.frequency.exponentialRampToValueAtTime(2080,t+.38);
  const sg=ctx.createGain();
  sg.gain.setValueAtTime(.0001,t);
  sg.gain.exponentialRampToValueAtTime(.055,t+.04);
  sg.gain.exponentialRampToValueAtTime(.0001,t+.38);
  sw.connect(sg); sg.connect(dest); sw.start(t); sw.stop(t+.4);
  /* staggered arpeggio — C major (clean, universal, uplifting) */
  [[523.25,.06],[659.25,.13],[783.99,.20],[1046.5,.28]].forEach(([f,dt])=>{
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=ctx.createGain(); const st=t+dt;
    g.gain.setValueAtTime(.0001,st);
    g.gain.exponentialRampToValueAtTime(.05,st+.015);
    g.gain.exponentialRampToValueAtTime(.0001,st+.75);
    o.connect(g); g.connect(dest); o.start(st); o.stop(st+.8);
  });
}

function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ── lead-in countdown: seconds of buffer before the show starts, so an
   external screen recorder can be rolling before frame one ── */
const START_DELAY = 5;

/* pick the best supported recording format — prefer MP4 (H.264/AAC),
   fall back to WebM only if the browser can't record MP4 */
function pickRecMime(){
  const prefs = [
    'video/mp4;codecs=avc1.640028,mp4a.40.2',
    'video/mp4;codecs=avc1,mp4a.40.2',
    'video/mp4;codecs=h264,aac',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm'
  ];
  for(const m of prefs){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}

async function runCountdown(secs){
  const el = $('countdown'), num = $('cd-num');
  el.style.display = 'flex';
  for(let n=secs; n>=1; n--){
    num.textContent = n;
    gsap.fromTo(num,{scale:.6,opacity:0},{scale:1,opacity:1,duration:.35,ease:'power3.out'});
    await delay(1000);
  }
  /* clear and hide, then wait two frames so the empty overlay is actually
     painted before recording starts — keeps the numbers out of the video */
  num.textContent='';
  el.style.display = 'none';
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
}

/* ── start the show (with optional recording) ── */
let mediaRec=null, recChunks=[], recTap=null;

/* ── background music — routed through the iframe's soft bus so it is
   both audible AND captured by the recorder; fades in/out gracefully ── */
const MUSIC_FILE = 'Interview%2001.mp3';   /* URL-encoded (space → %20) */
const MUSIC_VOL  = 0.10;                    /* soft bed under the continuous narration */
let musicSrc=null, musicGain=null;
async function startMusic(){
  try{
    const fw  = frame.contentWindow;
    const ctx = fw.getACtx(); fw.getMaster();           /* ensure soft bus exists */
    const bus = fw._softBus || ctx.destination;
    const res = await fetch(MUSIC_FILE);
    if(!res.ok){ console.warn('music not found:', MUSIC_FILE); return; }
    const buf = await ctx.decodeAudioData(await res.arrayBuffer());
    musicSrc = ctx.createBufferSource();
    musicSrc.buffer = buf; musicSrc.loop = true;        /* loop if shorter than 2 min */
    musicGain = ctx.createGain();
    const t = ctx.currentTime;
    musicGain.gain.setValueAtTime(0.0001, t);
    musicGain.gain.exponentialRampToValueAtTime(MUSIC_VOL, t+2.2);   /* fade in */
    musicSrc.connect(musicGain); musicGain.connect(bus);
    musicSrc.start(t);
  }catch(e){ console.warn('music error:', e); }
}
function stopMusic(){
  if(!musicGain) return;
  const ctx=musicGain.context, t=ctx.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(musicGain.gain.value, t);
  musicGain.gain.linearRampToValueAtTime(0.0001, t+3.0);            /* fade out */
  try{ musicSrc.stop(t+3.2); }catch(e){}
  musicSrc=null; musicGain=null;
}

/* ── continuous program voice-over (single file for the whole video) ──
   routed through the iframe's soft bus so the recorder captures it; sits
   clearly on top of the soft music bed for a strong VO/music balance ── */
const PROGRAM_VO     = 'VO/VO.mp3';
const VO_PROGRAM_VOL = 0.95;
let progVoSrc=null, progVoGain=null;
async function playProgramVO(){
  try{
    const fw=frame.contentWindow;
    const ctx=fw.getACtx(); fw.getMaster();
    const bus=fw._softBus||ctx.destination;
    const res=await fetch(PROGRAM_VO);
    if(!res.ok){ console.warn('VO not found:', PROGRAM_VO); return; }
    const buf=await ctx.decodeAudioData(await res.arrayBuffer());
    progVoSrc=ctx.createBufferSource(); progVoSrc.buffer=buf;
    progVoGain=ctx.createGain();
    const t=ctx.currentTime;
    progVoGain.gain.setValueAtTime(0.0001,t);
    progVoGain.gain.exponentialRampToValueAtTime(VO_PROGRAM_VOL,t+0.4);  /* gentle fade-in */
    progVoSrc.connect(progVoGain); progVoGain.connect(bus);
    progVoSrc.start(t);
  }catch(e){ console.warn('VO error:', e); }
}
function stopProgramVO(){
  if(!progVoGain) return;
  const ctx=progVoGain.context, t=ctx.currentTime;
  progVoGain.gain.cancelScheduledValues(t);
  progVoGain.gain.setValueAtTime(progVoGain.gain.value,t);
  progVoGain.gain.linearRampToValueAtTime(0.0001,t+0.6);
  try{ progVoSrc.stop(t+0.7); }catch(e){}
  progVoSrc=null; progVoGain=null;
}

/* ── voice-over: per-scene segments played in sync with each scene ──
   Files are optional — if one is missing, nothing plays (no error).
   Routed through the iframe's soft bus so the recorder captures it. */
const VO_VOL = 0.82;            /* narration level — clear but not overpowering */
const VO_DUCK = 0.06;           /* music level while narration plays             */
const VO_MAP = {
  s1:       'VO2/vo-02-individuals.mp3',
  s3:       'VO2/vo-03-company.mp3',
  otp:      'VO2/vo-04-otp.mp3',
  najm:     'VO2/vo-05-najm.mp3',
  estimate: ['VO2/vo-06-estimate.mp3','VO2/vo-10-estimate-final.mp3'],  /* runs twice */
  review:   ['VO2/vo-07-review.mp3','VO2/vo-11-review-final.mp3'],      /* runs twice */
  basher:   'VO2/vo-08-basher.mp3',
  other:    'VO2/vo-09-other.mp3'
};
let voSrc=null, voGain=null, voSeen={};
function voForScene(key){
  const m=VO_MAP[key]; if(!m) return null;
  if(Array.isArray(m)){ const i=voSeen[key]||0; voSeen[key]=i+1; return m[Math.min(i,m.length-1)]; }
  return m;
}
function stopVO(){
  if(voSrc){ try{ voSrc.onended=null; voSrc.stop(); }catch(e){} }
  voSrc=null; voGain=null;
}
async function playVO(file){
  return;                                     /* voice-over disabled in v4 (will be re-added later) */
  if(!file) return;
  try{
    const fw=frame.contentWindow;
    const ctx=fw.getACtx(); fw.getMaster();
    const bus=fw._softBus||ctx.destination;
    const res=await fetch(file);
    if(!res.ok) return;                       /* not uploaded yet — skip */
    const buf=await ctx.decodeAudioData(await res.arrayBuffer());
    stopVO();                                 /* cut any previous segment */
    voSrc=ctx.createBufferSource(); voSrc.buffer=buf;
    voGain=ctx.createGain(); voGain.gain.value=VO_VOL;
    voSrc.connect(voGain); voGain.connect(bus);
    /* duck the music under the narration */
    if(musicGain){
      const t=musicGain.context.currentTime;
      musicGain.gain.cancelScheduledValues(t);
      musicGain.gain.setValueAtTime(musicGain.gain.value,t);
      musicGain.gain.linearRampToValueAtTime(VO_DUCK,t+0.4);
    }
    /* restore music smoothly when narration ends */
    voSrc.onended=()=>{
      if(musicGain){
        const t=musicGain.context.currentTime;
        musicGain.gain.cancelScheduledValues(t);
        musicGain.gain.setValueAtTime(musicGain.gain.value,t);
        musicGain.gain.linearRampToValueAtTime(MUSIC_VOL,t+0.8);
      }
    };
    voSrc.start(ctx.currentTime);
  }catch(e){ /* ignore */ }
}

async function start(record, btn){
  $('playBtn').classList.add('hide'); $('recBtn').classList.add('hide');

  /* reset intro/outro + music + voice-over state (allows replay) */
  outroDone=false;
  voSeen={}; stopVO();
  gsap.set('#outro',{opacity:0,display:'none'});
  gsap.set('#intro-title',{opacity:0,display:'none'});
  stopMusic();

  const fw = frame.contentWindow;

  /* resume the iframe's audio engine on this user gesture */
  try{ const c = fw.getACtx(); if(c.state==='suspended') await c.resume(); }catch(e){}

  /* arm recording (screen picker appears now) — the recorder is prepared but
     not started yet, so the lead-in countdown below is NOT captured */
  if(record){
    /* go fullscreen so the 16:9 stage fills the screen — removes the dark
       top/bottom margins that otherwise show up as black bars in the video */
    try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); }catch(e){}
    try{
      const display = await navigator.mediaDevices.getDisplayMedia({
        video:{ frameRate:60, width:1920, height:1080 }, audio:false });
      const ctx = fw.getACtx(); fw.getMaster();
      if(!recTap){ recTap = ctx.createMediaStreamDestination(); fw._softBus.connect(recTap); }
      const stream = new MediaStream([...display.getVideoTracks(), ...recTap.stream.getAudioTracks()]);
      const mime = pickRecMime();
      mediaRec = new MediaRecorder(stream, mime ? {mimeType:mime, videoBitsPerSecond:16000000}
                                                : {videoBitsPerSecond:16000000});
      recChunks=[];
      mediaRec.ondataavailable=ev=>{ if(ev.data.size) recChunks.push(ev.data); };
      mediaRec.onstop=()=>{
        const isMp4 = (mediaRec.mimeType||mime||'').indexOf('mp4')>=0;
        const blob=new Blob(recChunks,{type: isMp4 ? 'video/mp4':'video/webm'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download='gig-presentation.'+(isMp4?'mp4':'webm'); a.click();
        display.getTracks().forEach(t=>t.stop());
        try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
      };
    }catch(err){
      try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e2){}
      alert('تعذّر بدء التسجيل: '+err.message);
    }
  }

  /* lead-in buffer so you can get a recorder rolling before the show begins */
  await runCountdown(START_DELAY);

  /* start the recording cleanly (countdown excluded), then the music */
  if(record && mediaRec){ try{ mediaRec.start(); }catch(e){} }

  /* kick off background music + continuous narration from 0:00 (fade in) */
  startMusic();
  playProgramVO();

  /* on-screen elapsed timer — visible only when previewing, never while recording */
  $('vidTimer').classList.toggle('show', !record);
  startVidTimer();

  /* 0) narrated opening journey (incl. the website address bar), then the
     tablet rises while the scene builds inside it */
  await introJourney();
  showHead('s1');
  const entering = tabletEnter();          /* start the rise (don't block) */
  await delay(450);                        /* a beat into the climb */
  try{ fw.run(); }catch(e){}               /* build the page while it rises */
  await entering;                          /* tablet settles, page is ready */
  tabletShine();                           /* light sweep on the settled tablet */
}

function ijOut(sel){ return new Promise(res=>gsap.to(sel,{opacity:0,scale:.92,y:-12,duration:.34,ease:'power2.in',onComplete:res})); }

  el.style.strokeDasharray=len; el.style.strokeDashoffset=len;
  gsap.to(el,{strokeDashoffset:0,duration:.55,ease:'power2.out'});
}
async function ijBarType(url){
  const u=$('ij-url'), caret=$('ij-caret');
  u.textContent='';
  await ijIn('#ij-bar');
  const blink=gsap.to(caret,{opacity:0,duration:.45,repeat:-1,yoyo:true,ease:'power1.inOut'});
  for(let i=0;i<=url.length;i++){ u.textContent=url.slice(0,i); await delay(i===0?180:70); }
  await delay(320); blink.kill(); gsap.set(caret,{opacity:0});
}

/* ── opening motion-graphics journey, narrated by the voice-over ── */
async function introJourney(){
  const a=getAudio();
  gsap.set('#intro-title',{opacity:0,display:'flex'});
  gsap.set('#it-glow',{opacity:0,scale:.72});
  gsap.set(['#ij-shield','#ij-list','#ij-docs','#ij-bar','#ij-money'],{opacity:0,scale:1,y:0,x:0});
  gsap.set('#it-cars',{opacity:1});
  gsap.set('.carL',{x:-240,y:0,rotation:0,opacity:0});
  gsap.set('.carR',{x:240, y:0,rotation:0,opacity:0});
  gsap.set('#it-crash',{opacity:0,scale:.3});
  $('ij-caption').textContent=''; gsap.set('#ij-caption',{opacity:0});

  await ijTween('#intro-title',{opacity:1,duration:.5,ease:'power2.out'});
  gsap.to('#it-glow',{opacity:1,scale:1,duration:1.8,ease:'power2.out'});

  /* BEAT 1 — accident */
  ijCap('لو صار لك حادث… لا قدّر الله');
  await playCrash(a);
  await delay(650);

  /* BEAT 2 — reassurance */
  gsap.to('#it-cars',{opacity:0,duration:.4});
  ijCap('وتأمينك مع جي آي جي… ريّح بالك');
  await ijIn('#ij-shield'); ijDraw('#ij-shield-chk'); if(a) sfxAppear(a);
  await delay(1150);
  await ijOut('#ij-shield');

  /* BEAT 3 — easier */
  ijCap('إجراءات المطالبة معك صارت أسهل');
  await ijIn('#ij-list');
  await delay(1100);
  await ijOut('#ij-list');

  /* BEAT 4 — upload documents + accident photos */
  ijCap('ارفع مستنداتك وصور الحادث');
  gsap.set('#ij-docs',{opacity:1,scale:1,y:0});
  gsap.fromTo('#ij-doc',{y:30,opacity:0},{y:0,opacity:1,duration:.5,ease:'power2.out'});
  gsap.fromTo('#ij-photo',{y:34,opacity:0},{y:0,opacity:1,duration:.5,delay:.12,ease:'power2.out'});
  ijDraw('#ij-up');
  await delay(760);
  gsap.to('#ij-doc',{y:-50,opacity:0,duration:.7,ease:'power2.in'});
  gsap.to('#ij-photo',{y:-50,opacity:0,duration:.7,delay:.1,ease:'power2.in'});
  if(a) sfxAppear(a);
  await delay(760);
  gsap.set('#ij-docs',{opacity:0});

  /* BEAT 5 — عبر موقعنا : the website address bar types itself */
  ijCap('عبر موقعنا');
  await ijBarType('www.gig.sa');
  await delay(600);
  await ijOut('#ij-bar');

  /* BEAT 6 — fast compensation */
  ijCap('ويوصلك تعويضك بأسرع وقت');
  gsap.fromTo('#ij-money',{opacity:0,scale:.8,x:18},{opacity:1,scale:1,x:0,duration:.55,ease:'back.out(1.4)'});
  gsap.fromTo('#ij-speed',{x:-16,opacity:.2},{x:0,opacity:1,duration:.4,repeat:1,yoyo:true});
  if(a) sfxAppear(a);
  await delay(1350);

  /* exit → reveals the stage for the tablet demo */
  gsap.to('#ij-caption',{opacity:0,y:-10,duration:.4,ease:'power2.in'});
  gsap.to('#ij-money',{opacity:0,duration:.4,ease:'power2.in'});
  gsap.to('#it-glow',{opacity:0,scale:1.3,duration:.6,ease:'power2.in'});
  await ijTween('#intro-title',{opacity:0,duration:.5,ease:'power2.in'});
  gsap.set('#intro-title',{display:'none'});
}

/* ── cinematic outro: brand logo end card ── */
async function showOutro(){
  const a=getAudio();
  playVO('VO2/vo-12-outro.mp3');             /* closing narration */
  gsap.set('#outro',{opacity:0,display:'flex'});
  gsap.set('#outro-glow',{opacity:0,scale:.72});
  gsap.set('#outro-logo',{opacity:0,scale:.84,y:16});
  gsap.set('#outro-url',{opacity:0});

  /* 1. light background fades in */
  await new Promise(res=>gsap.to('#outro',{opacity:1,duration:.7,ease:'power2.out',onComplete:res}));

  /* 2. glow blooms behind logo */
  gsap.to('#outro-glow',{opacity:1,scale:1,duration:1.6,ease:'power2.out'});
  await delay(400);   /* let the glow partially bloom before the logo appears */

  /* 3. logo reveal + chime */
  if(a) sfxChime(a);
  await new Promise(res=>gsap.to('#outro-logo',
    {opacity:1,scale:1,y:0,duration:.95,ease:'back.out(1.5)',onComplete:res}));

  /* 4. url fades in at bottom */
  await new Promise(res=>gsap.to('#outro-url',
    {opacity:1,duration:.55,ease:'power3.out',onComplete:res}));

  /* 6. hold */
  await delay(1100);
}

/* ── on-screen elapsed timer (preview only; never recorded) ── */
let vidTimerIv=null, vidStart=0;
function startVidTimer(){
  const el=$('vidTimer');
  vidStart=performance.now(); el.textContent='0:00';
  clearInterval(vidTimerIv);
  vidTimerIv=setInterval(()=>{
    const s=Math.floor((performance.now()-vidStart)/1000);
    el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  },250);
}
function stopVidTimer(){ clearInterval(vidTimerIv); vidTimerIv=null; }

/* run the outro then stop recording when the iframe signals the end */
let outroDone=false;
window.addEventListener('message', async e=>{
  if(e.data && e.data.gigScene==='end' && !outroDone){
    outroDone=true;
    stopVidTimer();       /* freeze the timer on the final duration */
    stopMusic();          /* fade music out as the outro begins */
    await delay(700);
    await showOutro();
    window.__outroEnd = performance.now();
    if(mediaRec && mediaRec.state!=='inactive') mediaRec.stop();
  }
});

$('playBtn').onclick = ()=>start(false);
$('recBtn').onclick  = ()=>start(true);
</script>
